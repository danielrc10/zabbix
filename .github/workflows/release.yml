# PT-BR: Publica os templates quando uma tag de versão é criada.
# EN: Publishes templates when a version tag is created.

name: Publicar versão / Publish release

on:
  push:
    tags:
      - 'web-service-monitoring-zabbix-7.4-v*'

permissions:
  contents: write

jobs:
  web-service-monitoring:
    name: Template Web Service Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Obter código / Check out code
        uses: actions/checkout@v5

      - name: Validar projeto / Validate project
        run: ruby templates/web-service-monitoring/zabbix-7.4/tools/validate_template.rb

      - name: Gerar arquivos / Build release files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp templates/web-service-monitoring/zabbix-7.4/template/template_web_service_monitoring.yaml \
            "$RUNNER_TEMP/release/template_web_service_monitoring.yaml"
          cp LICENSE NOTICE.md "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          sha256sum template_web_service_monitoring.yaml LICENSE NOTICE.md > SHA256SUMS

      - name: Criar Release / Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/template_web_service_monitoring.yaml" \
            "$RUNNER_TEMP/release/LICENSE" \
            "$RUNNER_TEMP/release/NOTICE.md" \
            "$RUNNER_TEMP/release/SHA256SUMS"
